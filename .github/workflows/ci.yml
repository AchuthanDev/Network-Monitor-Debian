name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make go-test
      - run: make go-build
      - run: make gateway-sim-test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - working-directory: apps/frontend
        run: npm install
      - working-directory: apps/frontend
        run: npm run lint
      - working-directory: apps/frontend
        run: npm test
      - working-directory: apps/frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deployments/docker/compose.yml config
      - run: docker build -f deployments/docker/api.Dockerfile .
      - run: docker build -f deployments/docker/collector.Dockerfile .
      - run: docker build -f deployments/docker/web.Dockerfile .
